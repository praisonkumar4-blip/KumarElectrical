<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employees | Kumar Electrical Contractor</title><link rel="stylesheet" href="style.css"></head><body data-page="employees" data-role="admin"><div class="dashboard-shell"><aside class="sidebar" id="sidebar"></aside><main class="main-area"><header class="dash-top"><div style="display:flex;align-items:center;gap:12px"><button class="btn ghost small mobile-menu" data-menu>☰</button><h2>People / Employees</h2></div><div class="top-actions"><button class="btn ghost small" data-theme>◐ Theme</button><span class="avatar" data-avatar>KA</span></div></header><div class="main-content"><div class="welcome-row"><div><h1>Employee directory</h1><p>Manage your team, roles, wages and site assignments.</p></div><button class="btn" id="addEmployeeBtn">＋ Add employee</button></div><div class="toolbar"><input class="search-input" id="employeeSearch" placeholder="Search name, ID or mobile…"><select id="roleFilter"><option value="">All trades</option><option>Electrician</option><option>Plumber</option><option>Helper</option><option>Supervisor</option><option>Technician</option></select><select id="statusFilter"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select><span class="spacer"></span><button class="btn ghost small" id="exportEmployees">Export CSV ↓</button></div><section class="panel"><div class="table-wrap" id="employeeTable"></div></section></div></main></div><div class="modal-backdrop" id="employeeModal"><form class="modal" id="employeeForm"><div class="modal-head"><h2 id="employeeModalTitle">Add employee</h2><button class="close-btn" type="button" data-close="employeeModal">✕</button></div><input type="hidden" id="editEmployeeId"><div class="form-grid"><div class="field"><label>Employee ID *</label><input id="empId" required placeholder="EMP003"></div><div class="field"><label>Full name *</label><input id="empName" required></div><div class="field"><label>Mobile number *</label><input id="empMobile" required inputmode="tel" pattern="[0-9+() -]{8,18}"></div><div class="field"><label>Trade / role *</label><select id="empRole" required><option>Electrician</option><option>Plumber</option><option>Helper</option><option>Supervisor</option><option>Technician</option></select></div><div class="field"><label>Daily wage (₹) *</label><input id="empWage" required type="number" min="0" step="1"></div><div class="field"><label>Joining date</label><input id="empJoining" type="date"></div><div class="field"><label>Assigned worksite</label><select id="empSite"><option value="">Unassigned</option></select></div><div class="field"><label>Status</label><select id="empStatus"><option>Active</option><option>Inactive</option></select></div><div class="field wide"><label>Address</label><textarea id="empAddress" placeholder="Employee address"></textarea></div></div><div class="modal-actions"><button class="btn ghost" type="button" data-close="employeeModal">Cancel</button><button class="btn" type="submit">Save employee</button></div></form></div><div class="toast-region" id="toastRegion"></div><script src="api.js"></script><script src="app.js"></script></body></html>
